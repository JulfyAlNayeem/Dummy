# livekit.yaml
# Place at project root (same level as docker-compose.prod.yml)
# LiveKit SFU server configuration

port: 7880

rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50200
  # use_external_ip: true auto-detects your VPS public IP
  # This is required so browser WebRTC can reach the server
  use_external_ip: true

# API keys — MUST match LIVEKIT_API_KEY and LIVEKIT_API_SECRET in .env.production
# Format: "api_key: api_secret" (note the space after colon)
keys:
  your_api_key: your_api_secret

logging:
  level: info
  pion_level: error

room:
  empty_timeout: 300        # delete empty room after 5 minutes
  max_participants: 50      # max people per call
  enable_remote_ice_candidates: true  # helps users behind strict firewalls
