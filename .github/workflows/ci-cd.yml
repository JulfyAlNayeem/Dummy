# =============================================================================
# CI/CD Pipeline for Dummy Project
# =============================================================================
# WORKFLOW STAGES:
# 1. test-backend    - Validates backend (install + build)
# 2. test-frontend   - Vite build for frontend
# 3. build-*         - 2 Docker images built IN PARALLEL (backend + frontend)
# 4. deploy          - SSH deploy to VPS (after all builds succeed)
#
# WHY PARALLEL BUILDS:
#   Old: images built sequentially → slow
#   New: images built in parallel jobs → ~2-3 min wall-clock time
#
# REQUIRED GITHUB SECRETS:
#   DOCKERHUB_USERNAME  - Your Docker Hub username
#   DOCKERHUB_TOKEN     - Docker Hub access token
#   VPS_HOST            - VPS server IP address
#   VPS_USER            - SSH username
#   VPS_SSH_KEY         - Private SSH key
#   VPS_PORT            - SSH port (usually 22)
# =============================================================================

name: CI/CD Pipeline

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  NODE_VERSION: '24.x'

jobs:
  # ===========================================================================
  # JOB 1a: TEST BACKEND
  # ===========================================================================
  test-backend:
    name: Test - Backend
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}

    - uses: pnpm/action-setup@v4
      with:
        version: latest

    - name: Cache pnpm store
      uses: actions/cache@v4
      with:
        path: ~/.local/share/pnpm/store
        key: pnpm-backend-${{ runner.os }}-${{ hashFiles('backend/pnpm-lock.yaml') }}
        restore-keys: pnpm-backend-${{ runner.os }}-

    - name: Install backend dependencies
      run: pnpm install --frozen-lockfile --ignore-scripts
      working-directory: backend

    - name: Build backend
      run: pnpm run build
      working-directory: backend
      env:
        NODE_ENV: production

  # ===========================================================================
  # JOB 1b: TEST FRONTEND
  # ===========================================================================
  test-frontend:
    name: Test - Frontend
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}

    - uses: pnpm/action-setup@v4
      with:
        version: latest

    - name: Cache pnpm store
      uses: actions/cache@v4
      with:
        path: ~/.local/share/pnpm/store
        key: pnpm-frontend-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}
        restore-keys: pnpm-frontend-${{ runner.os }}-

    - name: Install frontend dependencies
      run: pnpm install --frozen-lockfile --ignore-scripts
      working-directory: frontend

    - name: Build frontend
      run: pnpm run build
      working-directory: frontend
      env:
        CI: false

  # ===========================================================================
  # JOB 2: BUILD DOCKER IMAGES — IN PARALLEL
  # ===========================================================================
  build-backend:
    name: Build - Backend Image
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    if: github.ref == 'refs/heads/main'
    steps:
    - uses: actions/checkout@v4

    - uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - uses: docker/setup-buildx-action@v3

    - uses: docker/build-push-action@v5
      with:
        context: .
        file: ./backend/Dockerfile
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/dummy-backend:latest
        cache-from: type=gha,scope=backend
        cache-to: type=gha,mode=max,scope=backend

  build-frontend:
    name: Build - Frontend Image
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    if: github.ref == 'refs/heads/main'
    steps:
    - uses: actions/checkout@v4

    - uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - uses: docker/setup-buildx-action@v3

    - uses: docker/build-push-action@v5
      with:
        context: .
        file: ./frontend/Dockerfile-production
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/dummy-frontend:latest
        cache-from: type=gha,scope=frontend
        cache-to: type=gha,mode=max,scope=frontend

  # ===========================================================================
  # JOB 3: DEPLOY TO PRODUCTION VPS
  # Waits for ALL parallel build jobs to succeed.
  # ===========================================================================
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    if: github.ref == 'refs/heads/main'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Deploy to VPS
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        key: ${{ secrets.VPS_SSH_KEY }}
        port: ${{ secrets.VPS_PORT }}
        command_timeout: 30m
        script: |
          set -euo pipefail
          echo "=== Starting Deployment ==="

          # Navigate to project directory
          cd /opt/Dummy || exit 1

          # Pull latest config from GitHub
          if [ -d ".git" ]; then
            git fetch origin main 2>/dev/null && git reset --hard origin/main || \
              echo "Warning: Could not pull latest code. Using existing config."
          fi

          # Ensure uploads directory exists
          sudo mkdir -p ./backend/uploads/images
          sudo chown -R 1000:1000 ./backend/uploads
          sudo chmod -R 755 ./backend/uploads

          # Update DOCKERHUB_USERNAME in production env
          grep -q "^DOCKERHUB_USERNAME=" .env.production && \
            sed -i "s|^DOCKERHUB_USERNAME=.*|DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}|" .env.production || \
            echo "DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}" >> .env.production

          # Login to Docker Hub
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | sudo docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin || exit 1

          # Pull new images (individually so one failure doesn't block others)
          echo "Pulling latest Docker images..."
          PULL_FAILED=false
          for IMG in backend frontend; do
            echo "  Pulling dummy-$IMG..."
            if ! sudo docker compose -f docker-compose.prod.yml --env-file .env.production pull "$IMG" 2>&1; then
              echo "  WARNING: Could not pull $IMG. Using cached image."
              PULL_FAILED=true
            fi
          done
          [ "$PULL_FAILED" = "true" ] && echo "WARNING: Some images used cached layers."

          # Stop and remove old app containers (keep DB + Redis + LiveKit running)
          echo "Stopping old app containers..."
          sudo docker compose -f docker-compose.prod.yml --env-file .env.production stop backend frontend || true
          sudo docker compose -f docker-compose.prod.yml --env-file .env.production rm -f backend frontend || true

          # Start new containers
          echo "Starting new containers..."
          if ! sudo docker compose -f docker-compose.prod.yml --env-file .env.production up -d backend frontend; then
            echo "ERROR: Failed to start containers"
            sudo docker compose -f docker-compose.prod.yml --env-file .env.production logs --tail 100
            exit 1
          fi

          # Wait for backend readiness
          echo "Waiting for backend readiness..."
          RETRIES=30
          COUNT=0
          until [ $COUNT -ge $RETRIES ]; do
            if sudo docker compose -f docker-compose.prod.yml --env-file .env.production \
              exec -T backend wget --quiet --tries=1 --spider http://localhost:3001/health 2>/dev/null; then
              echo "Backend is healthy"
              break
            fi
            COUNT=$((COUNT+1))
            echo "Waiting ($COUNT/$RETRIES)..."
            sleep 3
          done

          # Recreate nginx LAST (after services are up — nginx caches DNS at startup)
          echo "Recreating nginx proxy..."
          sudo docker compose -f docker-compose.prod.yml --env-file .env.production \
            up -d --force-recreate nginx-proxy || true

          # Cleanup unused images
          sudo docker image prune -f || true

          # Verify all containers running
          echo "=== Container Status ==="
          sudo docker compose -f docker-compose.prod.yml --env-file .env.production ps

          BACKEND_STATUS=$(sudo docker ps --filter "name=dummy-backend-prod" --format "{{.Status}}" 2>/dev/null || echo "")
          FRONTEND_STATUS=$(sudo docker ps --filter "name=dummy-frontend-prod" --format "{{.Status}}" 2>/dev/null || echo "")

          if [ -z "$BACKEND_STATUS" ]; then
            echo "ERROR: Backend is not running!"
            sudo docker logs dummy-backend-prod --tail 100 2>&1 || true
            exit 1
          fi

          if [ -z "$FRONTEND_STATUS" ]; then
            echo "ERROR: Frontend is not running!"
            sudo docker logs dummy-frontend-prod --tail 100 2>&1 || true
            exit 1
          fi

          echo ""
          echo "=========================================="
          echo "   DEPLOYMENT COMPLETED SUCCESSFULLY!"
          echo "=========================================="
          echo "Frontend:  http://${{ secrets.VPS_HOST }}"
          echo "Backend:   http://${{ secrets.VPS_HOST }}/api"
          echo "LiveKit:   ws://${{ secrets.VPS_HOST }}:7880"
          echo "=========================================="
