services:
  # MySQL Database
  mysql:
    image: mysql:8
    container_name: dummy-mysql
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: DummyDB@2025!Secure
      MYSQL_DATABASE: dummy
      MYSQL_USER: dummyuser313
      MYSQL_PASSWORD: "9Rob0cO)1x9(cZ]0S.H?"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "dummyuser313", "-p9Rob0cO)1x9(cZ]0S.H?"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - dummy-network

  # phpMyAdmin (optional DB admin UI)
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: dummy-phpmyadmin
    restart: always
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - dummy-network

  # Redis for sessions and Socket.io adapter
  redis:
    image: redis:7-alpine
    container_name: dummy-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - dummy-network

  # Backend Node.js Application
  backend:
    build:
      context: .
      dockerfile: backend/api-service/Dockerfile
    container_name: api-service
    restart: always
    ports:
      - "3001:3001"
    volumes:
      - ./backend/api-service/src:/app/backend/api-service/src
      - ./backend/api-service/prisma:/app/backend/api-service/prisma
      - ./backend/api-service/uploads:/app/backend/api-service/uploads
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: "mysql://dummyuser313:9Rob0cO%291x9%28cZ%5D0S.H%3F@mysql:3306/dummy"
      REDIS_URL: redis://redis:6379
      SESSION_SECRET: dev-session-secret-change-in-production
      JWT_SECRET: dev-jwt-secret-change-in-production
      ACCESS_TOKEN_SECRET: s3cr3tAcc3ssT0k3nK3y
      REFRESH_TOKEN_SECRET: s3cr3tR3fr3shT0k3nK3y
      ORIGIN_URL: http://localhost:3002
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - dummy-network

  # Messenger Frontend (Development)
  frontend-messenger:
    build:
      context: .
      dockerfile: frontend/messenger/Dockerfile-development
    container_name: dummy-messenger
    restart: always
    ports:
      - "3002:3002"
    volumes:
      - ./frontend/messenger/src:/app/frontend/messenger/src
      - ./frontend/messenger/public:/app/frontend/messenger/public
      - ./frontend/messenger/index.html:/app/frontend/messenger/index.html
      - ./frontend/messenger/vite.config.js:/app/frontend/messenger/vite.config.js
      - ./frontend/messenger/tailwind.config.js:/app/frontend/messenger/tailwind.config.js
      - ./frontend/messenger/postcss.config.js:/app/frontend/messenger/postcss.config.js
    environment:
      VITE_API_URL: http://localhost:3001
      VITE_BACKEND_URL: http://backend:3001
      VITE_CALLING_SERVICE_URL: http://calling-service:3003
      VITE_MESSAGE_SERVICE_URL: http://message-service:3004
      VITE_CLASS_SERVICE_URL: http://class-service:3005
      VITE_FORM_SERVICE_URL: http://form-service:3006
      VITE_ALARM_SERVICE_URL: http://alarm-service:3007
      VITE_SOCIAL_SERVICE_URL: http://social-service:3008
    depends_on:
      - backend
    networks:
      - dummy-network

  # Social Frontend (Development)
  frontend-social:
    build:
      context: .
      dockerfile: frontend/social/Dockerfile-development
    container_name: dummy-social-frontend
    restart: always
    ports:
      - "3010:3010"
    volumes:
      - ./frontend/social/src:/app/frontend/social/src
      - ./frontend/social/public:/app/frontend/social/public
      - ./frontend/social/index.html:/app/frontend/social/index.html
      - ./frontend/social/vite.config.js:/app/frontend/social/vite.config.js
      - ./frontend/social/tailwind.config.js:/app/frontend/social/tailwind.config.js
      - ./frontend/social/postcss.config.js:/app/frontend/social/postcss.config.js
    environment:
      VITE_API_URL: http://localhost:3001
      VITE_BACKEND_URL: http://backend:3001
      VITE_SOCIAL_SERVICE_URL: http://social-service:3008
    depends_on:
      - backend
      - social-service
    networks:
      - dummy-network

  # Audio/Video Calling Microservice
  calling-service:
    build:
      context: .
      dockerfile: backend/calling-service/Dockerfile
    container_name: calling-service
    restart: always
    ports:
      - "3003:3003"
      - "10000-10100:10000-10100/udp"
    volumes:
      - ./backend/calling-service/src:/app/backend/calling-service/src
      - ./backend/calling-service/prisma:/app/backend/calling-service/prisma
    environment:
      NODE_ENV: development
      PORT: 3003
      DATABASE_URL: "mysql://dummyuser313:9Rob0cO%291x9%28cZ%5D0S.H%3F@mysql:3306/dummy"
      REDIS_URL: redis://redis:6379
      ACCESS_TOKEN_SECRET: s3cr3tAcc3ssT0k3nK3y
      ORIGIN_URL: http://localhost:3002
      MEDIASOUP_LISTEN_IP: 0.0.0.0
      MEDIASOUP_ANNOUNCED_IP: 127.0.0.1
      MEDIASOUP_WORKERS: 2
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - dummy-network

  # ── Microservices ─────────────────────────────────────────────────────────────

  # Message Microservice (real-time messaging + Socket.IO)
  message-service:
    build:
      context: .
      dockerfile: backend/message-service/Dockerfile
    container_name: message-service
    restart: always
    ports:
      - "3004:3004"
    volumes:
      - ./backend/message-service/src:/app/backend/message-service/src
      - ./backend/message-service/prisma:/app/backend/message-service/prisma
      - ./backend/message-service/uploads:/app/backend/message-service/uploads
    environment:
      NODE_ENV: development
      PORT: 3004
      DATABASE_URL: "mysql://dummyuser313:9Rob0cO%291x9%28cZ%5D0S.H%3F@mysql:3306/dummy"
      REDIS_URL: redis://redis:6379
      ACCESS_TOKEN_SECRET: s3cr3tAcc3ssT0k3nK3y
      ORIGIN_URL: http://localhost:3002
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - dummy-network

  # Class Microservice (classroom management + session crons)
  class-service:
    build:
      context: .
      dockerfile: backend/class-service/Dockerfile
    container_name: class-service
    restart: always
    ports:
      - "3005:3005"
    volumes:
      - ./backend/class-service/src:/app/backend/class-service/src
      - ./backend/class-service/prisma:/app/backend/class-service/prisma
    environment:
      NODE_ENV: development
      PORT: 3005
      DATABASE_URL: "mysql://dummyuser313:9Rob0cO%291x9%28cZ%5D0S.H%3F@mysql:3306/dummy"
      REDIS_URL: redis://redis:6379
      ACCESS_TOKEN_SECRET: s3cr3tAcc3ssT0k3nK3y
      ORIGIN_URL: http://localhost:3002
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - dummy-network

  # Form Microservice (dynamic forms, assignments, submissions)
  form-service:
    build:
      context: .
      dockerfile: backend/form-service/Dockerfile
    container_name: form-service
    restart: always
    ports:
      - "3006:3006"
    volumes:
      - ./backend/form-service/src:/app/backend/form-service/src
      - ./backend/form-service/prisma:/app/backend/form-service/prisma
    environment:
      NODE_ENV: development
      PORT: 3006
      DATABASE_URL: "mysql://dummyuser313:9Rob0cO%291x9%28cZ%5D0S.H%3F@mysql:3306/dummy"
      ACCESS_TOKEN_SECRET: s3cr3tAcc3ssT0k3nK3y
      ORIGIN_URL: http://localhost:3002
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - dummy-network

  # Alarm Microservice (alertness checks + Socket.IO)
  alarm-service:
    build:
      context: .
      dockerfile: backend/alarm-service/Dockerfile
    container_name: alarm-service
    restart: always
    ports:
      - "3007:3007"
    volumes:
      - ./backend/alarm-service/src:/app/backend/alarm-service/src
      - ./backend/alarm-service/prisma:/app/backend/alarm-service/prisma
    environment:
      NODE_ENV: development
      PORT: 3007
      DATABASE_URL: "mysql://dummyuser313:9Rob0cO%291x9%28cZ%5D0S.H%3F@mysql:3306/dummy"
      REDIS_URL: redis://redis:6379
      ACCESS_TOKEN_SECRET: s3cr3tAcc3ssT0k3nK3y
      ORIGIN_URL: http://localhost:3002
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - dummy-network

  # Social Microservice (posts, comments, reactions)
  social-service:
    build:
      context: .
      dockerfile: backend/social-service/Dockerfile
    container_name: social-service
    restart: always
    ports:
      - "3008:3008"
    volumes:
      - ./backend/social-service/src:/app/backend/social-service/src
      - ./backend/social-service/prisma:/app/backend/social-service/prisma
      - ./backend/social-service/uploads:/app/backend/social-service/uploads
    environment:
      NODE_ENV: development
      PORT: 3008
      DATABASE_URL: "mysql://dummyuser313:9Rob0cO%291x9%28cZ%5D0S.H%3F@mysql:3306/dummy"
      REDIS_URL: redis://redis:6379
      ACCESS_TOKEN_SECRET: s3cr3tAcc3ssT0k3nK3y
      ORIGIN_URL: http://localhost:3002
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - dummy-network

  # Scheduler Microservice (reminder notifications, encryption key rotation)
  scheduler-service:
    build:
      context: .
      dockerfile: backend/scheduler-service/Dockerfile
    container_name: scheduler-service
    restart: always
    ports:
      - "3009:3009"
    volumes:
      - ./backend/scheduler-service/src:/app/backend/scheduler-service/src
      - ./backend/scheduler-service/prisma:/app/backend/scheduler-service/prisma
      - ./backups:/app/backups
    environment:
      NODE_ENV: development
      PORT: 3009
      DATABASE_URL: "mysql://dummyuser313:9Rob0cO%291x9%28cZ%5D0S.H%3F@mysql:3306/dummy"
      REDIS_URL: redis://redis:6379
      ACCESS_TOKEN_SECRET: s3cr3tAcc3ssT0k3nK3y
      TZ: Asia/Dhaka
      DUMP_DIR: /app/backups
      UPLOAD_TO_GCS: "false"
      KEEP_LOCAL_BACKUP: "true"
      LOCAL_RETENTION_DAYS: "7"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - dummy-network

volumes:
  mysql_data:
  redis_data:

networks:
  dummy-network:
    driver: bridge
