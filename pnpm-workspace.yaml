packages:
  - backend/api-service
  - frontend/messenger
  - frontend/social
  - backend/calling-service
  - backend/message-service
  - backend/conversation-service
  - backend/form-service
  - backend/alarm-service
  - backend/social-service
  - backend/scheduler-service

# pnpm v10: explicitly list packages allowed to run install scripts
onlyBuiltDependencies:
  - "@prisma/engines"
  - esbuild
  - mediasoup
  - prisma
  - sharp

# Disable minimum release age security policy (allow recently published packages)
pnpm:
  minimumReleaseAge: "0 seconds"
